name: Build and deploy a container to Harbor

env:
  HARBOR_SERVER: 193.190.127.141:80  # set this to the name of your Azure Web App
  HARBOR_REPO: library
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    uses: togoetha/actionstest/.github/workflows/python-app.yml@main
  build:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GitHub container registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          
          registry: ${{ env.HARBOR_SERVER }}
          username: MLOps
          password: MLOps123
      - name: Build and push container image to registry
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          push: true
          tags: ${{ env.HARBOR_SERVER }}/${{ env.HARBOR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          file: ./Dockerfile


